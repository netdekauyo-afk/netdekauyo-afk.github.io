name: Temporary Notion connection check

on:
  push:
    branches: [test/notion-connection-check]
    paths: [.github/workflows/notion-connection-check.yml]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify access without publishing content
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        shell: python
        run: |
          import hashlib, json, os, sys, urllib.request, urllib.error
          token = os.environ.get("NOTION_TOKEN", "")
          if not token:
              print("FAIL: required authentication secret is unavailable")
              sys.exit(1)
          def request(path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  "https://api.notion.com/v1/" + path, data=data,
                  headers={"Authorization": "Bearer " + token,
                           "Notion-Version": "2022-06-28",
                           "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  print("FAIL: Notion HTTP status " + str(error.code))
                  sys.exit(1)
              except Exception:
                  print("FAIL: connection or response error")
                  sys.exit(1)
          target_hash = "a7c894134974cad51c26ba393ac55adeb8833ad779230caac5564e653c560dce"
          cursor = None
          target = None
          for _ in range(20):
              payload = {"filter": {"value": "page", "property": "object"}, "page_size": 100}
              if cursor:
                  payload["start_cursor"] = cursor
              results = request("search", payload)
              for page in results.get("results", []):
                  page_id = page.get("id", "")
                  digest = hashlib.sha256(page_id.replace("-", "").lower().encode()).hexdigest()
                  if digest == target_hash:
                      target = page_id
                      break
              if target or not results.get("has_more"):
                  break
              cursor = results.get("next_cursor")
          if not target:
              print("FAIL: target page was not discoverable")
              sys.exit(1)
          page = request("pages/" + target)
          if page.get("object") != "page":
              print("FAIL: unexpected page response")
              sys.exit(1)
          blocks = request("blocks/" + target + "/children?page_size=1")
          if blocks.get("object") != "list":
              print("FAIL: unexpected content response")
              sys.exit(1)
          print("PASS: target page and child-block endpoint are accessible")
