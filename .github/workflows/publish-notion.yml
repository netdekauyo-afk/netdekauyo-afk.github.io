name: Publish Notion knowledge index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-notion.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Build index from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          python - <<'PY'
          import html
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          token = os.environ["NOTION_TOKEN"]
          parent_id = "41601ab2d340816d93e6d5d964e4aea1"
          headers = {
              "Authorization": f"Bearer {token}",
              "Notion-Version": "2022-06-28",
          }

          def get(path, params=None):
              url = "https://api.notion.com/v1/" + path
              if params:
                  url += "?" + urlencode(params)
              with urlopen(Request(url, headers=headers), timeout=30) as res:
                  return json.load(res)

          children = []
          cursor = None
          while True:
              params = {"page_size": 100}
              if cursor:
                  params["start_cursor"] = cursor
              response = get(f"blocks/{parent_id}/children", params)
              children.extend(b for b in response["results"] if b["type"] == "child_page")
              if not response["has_more"]:
                  break
              cursor = response["next_cursor"]

          if not children:
              raise RuntimeError("Notionの子ページを取得できませんでした")

          items = []
          for block in children:
              page = get(f"pages/{block['id']}")
              title = html.escape(block["child_page"]["title"])
              url = page["url"]
              if not url.startswith(("https://www.notion.so/", "https://notion.so/", "https://app.notion.com/")):
                  raise RuntimeError("予期しないページURLです")
              items.append(f'<li><a href="{html.escape(url, quote=True)}">{title}</a></li>')

          output = (
              '<!doctype html>\n<html lang="ja">\n<head>\n'
              '<meta charset="utf-8">\n'
              '<meta name="viewport" content="width=device-width,initial-scale=1">\n'
              "<meta name=\"color-scheme\" content=\"dark\">\n<meta name=\"theme-color\" content=\"#10151f\">\n<style>\n  :root { color-scheme: dark; }\n  * { box-sizing: border-box; }\n  body {\n    margin: 0; min-height: 100vh; padding: clamp(24px, 5vw, 64px) 20px;\n    background: #10151f; color: #e6edf3;\n    font-family: system-ui, -apple-system, \"Segoe UI\", \"Noto Sans JP\", sans-serif;\n    line-height: 1.7;\n  }\n  main { max-width: 880px; margin-inline: auto; }\n  h1 { margin: 0 0 28px; font-size: clamp(1.5rem, 4vw, 2rem); line-height: 1.4; }\n  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }\n  li { margin: 0; }\n  a {\n    display: block; padding: 18px 20px; border: 1px solid #374456;\n    border-radius: 12px; background: #1a2330; color: #9dccff;\n    text-decoration: underline; text-underline-offset: 4px; overflow-wrap: anywhere;\n  }\n  a:visited { color: #c9b8ff; }\n  a:hover { background: #243247; border-color: #80b8f2; color: #c7e2ff; }\n  a:focus-visible { outline: 3px solid #80b8f2; outline-offset: 4px; }\n  @media (prefers-reduced-motion: no-preference) {\n    a { transition: background-color 120ms ease, border-color 120ms ease; }\n  }\n</style>\n"
              '<title>制作技術・知識一覧</title>\n</head>\n<body>\n<main>\n'
              '<h1>制作技術・知識一覧</h1>\n<ul>\n'
              + "\n".join(items)
              + '\n</ul>\n</main>\n</body>\n</html>\n'
          )
          Path("site").mkdir(exist_ok=True)
          Path("site/index.html").write_text(output, encoding="utf-8")
          print(f"公開一覧: {len(items)}ページ")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
